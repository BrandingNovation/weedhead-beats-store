<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weedhead Beats - AI Store</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #000000; /* Palette Black */
        color: #94A6A5; /* Palette Light Grey/Teal */
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #000000; 
      }
      ::-webkit-scrollbar-thumb {
        background: #303D3C; /* Palette Dark Slate */
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94A6A5; /* Palette Light Teal */
      }
      
      .text-brand-green { color: #0D5F11; }
      .bg-brand-green { background-color: #0D5F11; }
      .bg-brand-slate { background-color: #303D3C; }
      .text-brand-teal { color: #94A6A5; }
      .border-brand-slate { border-color: #303D3C; }
      
      /* Force ALL inputs, textareas, and selects to have DARK text for visibility on light backgrounds */
      input,
      textarea,
      select {
        color: #000000 !important;
        caret-color: #0D5F11 !important;
      }
      
      input[type="text"],
      input[type="email"],
      input[type="password"],
      input[type="number"],
      input[type="url"],
      input[type="search"],
      input[type="tel"],
      textarea,
      select {
        color: #000000 !important;
        caret-color: #0D5F11 !important;
        -webkit-text-fill-color: #000000 !important;
      }
      
      /* Force placeholder colors - lighter gray for placeholders */
      input::placeholder,
      textarea::placeholder {
        color: #666666 !important;
        opacity: 1 !important;
        -webkit-text-fill-color: #666666 !important;
      }
      
      /* Make select options visible with dark text */
      select option {
        background-color: #ffffff !important;
        color: #000000 !important;
      }
      
      /* Override any Tailwind text color classes on inputs */
      input.text-white,
      textarea.text-white,
      select.text-white {
        color: #000000 !important;
        -webkit-text-fill-color: #000000 !important;
      }
      
      /* Force autofill to be dark text */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus,
      input:-webkit-autofill:active {
        -webkit-text-fill-color: #000000 !important;
        -webkit-box-shadow: 0 0 0px 1000px #ffffff inset !important;
        box-shadow: 0 0 0px 1000px #ffffff inset !important;
      }
      
      /* Print Styles for Receipt */
      @media print {
        /* Hide everything except receipt */
        body > #root > *:not(:has(.receipt-print-container)) {
          display: none !important;
        }
        
        /* Show receipt container */
        .receipt-print-container {
          display: block !important;
          position: absolute !important;
          top: 0 !important;
          left: 0 !important;
          width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
          background: white !important;
          z-index: 9999 !important;
        }
        
        /* Style the receipt content - make sure it's visible */
        .receipt-print {
          display: block !important;
          visibility: visible !important;
          position: relative !important;
          width: 100% !important;
          max-width: 100% !important;
          margin: 0 auto !important;
          padding: 20mm !important;
          background: white !important;
          color: #000000 !important;
          border: none !important;
          box-shadow: none !important;
          page-break-after: avoid !important;
          page-break-inside: avoid !important;
        }
        
        /* Ensure all text elements are visible */
        .receipt-print h1,
        .receipt-print h2,
        .receipt-print h3,
        .receipt-print p,
        .receipt-print div,
        .receipt-print span {
          display: block !important;
          visibility: visible !important;
          color: #000000 !important;
        }
        
        /* Inline elements */
        .receipt-print span,
        .receipt-print strong,
        .receipt-print em {
          display: inline !important;
        }
        
        /* Hide buttons and download links */
        .receipt-print button,
        .receipt-print a[href*="track"],
        .receipt-print a[download],
        .receipt-print .print\\:hidden,
        .receipt-print svg {
          display: none !important;
        }
        
        /* Text color overrides */
        .receipt-print .text-brand-teal,
        .receipt-print .text-brand-teal * {
          color: #333333 !important;
        }
        
        .receipt-print .text-white,
        .receipt-print .text-white * {
          color: #000000 !important;
        }
        
        .receipt-print .text-brand-green,
        .receipt-print .text-brand-green * {
          color: #0D5F11 !important;
        }
        
        /* Remove backgrounds */
        .receipt-print .bg-brand-black,
        .receipt-print .bg-brand-slate,
        .receipt-print .bg-brand-slate\\/20,
        .receipt-print .bg-green-500\\/20 {
          background: transparent !important;
        }
        
        .receipt-print .border-brand-slate {
          border-color: #cccccc !important;
        }
        
        /* Print-friendly layout */
        @page {
          margin: 10mm;
          size: A4;
        }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
